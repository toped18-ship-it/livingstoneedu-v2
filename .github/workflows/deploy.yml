name: Deploy to LivingTech (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write # Required for JamesIves/github-pages-deploy-action to write to gh-pages branch
  pages: write # Required for actions/deploy-pages to deploy directly
  id-token: write # Required for OIDC connection

jobs:
  web-deploy:
    name: Build and Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Get Latest Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Inject Build ID into Service Worker and App Entry
        run: |
          sed -i "s/BUILD_ID/${{ github.sha }}/g" public/sw.js
          sed -i "s/BUILD_ID/${{ github.sha }}/g" src/main.tsx

      - name: Build Application
        run: npx vite build

      - name: Create CNAME file for Custom Domain
        run: echo "livingtech.name.ng" > dist/CNAME

      - name: Create .nojekyll file to bypass Jekyll processing
        run: touch dist/.nojekyll

      - name: Create 404.html for SPA Routing
        run: cp dist/index.html dist/404.html

      - name: Verify dist contents before deployment
        run: |
          echo "=== Verifying Build Output Directory (dist) ==="
          ls -la dist
          
          # Assert critical files are present
          if [ ! -f dist/sw.js ]; then
            echo "Error: sw.js is missing from the build output!"
            exit 1
          fi
          if [ ! -f dist/manifest.json ]; then
            echo "Error: manifest.json is missing from the build output!"
            exit 1
          fi
          if [ ! -f dist/logo.jpg ]; then
            echo "Error: logo.jpg is missing from the build output!"
            exit 1
          fi
          echo "All critical static assets are verified and present in dist!"

      - name: Deploy to gh-pages branch (for Deploy from Branch setting)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: dist
          branch: gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact for direct deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages (for GitHub Actions setting)
        id: deployment
        uses: actions/deploy-pages@v4


